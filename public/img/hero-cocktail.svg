<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 800" role="img" aria-label="Coquetel rubi com gelo e frutas sobre fundo escuro">
<defs>
  <radialGradient id="halo"><stop stop-color="#fa5f40" stop-opacity=".40"/><stop offset=".45" stop-color="#f05342" stop-opacity=".14"/><stop offset="1" stop-color="#df392e" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fcf7f3" stop-opacity=".88"/><stop offset=".18" stop-color="#e9dfd8" stop-opacity=".08"/><stop offset=".61" stop-color="#fff" stop-opacity=".19"/><stop offset="1" stop-color="#f8fcff" stop-opacity=".82"/></linearGradient>
  <linearGradient id="drink" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#ff9582"/><stop offset=".18" stop-color="#fd4c52"/><stop offset=".59" stop-color="#b51742"/><stop offset="1" stop-color="#6c092c"/></linearGradient>
  <linearGradient id="darkdrink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f24e5c"/><stop offset="1" stop-color="#710b3f"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe6ab"/><stop offset=".5" stop-color="#d6a667"/><stop offset="1" stop-color="#9c602e"/></linearGradient>
  <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="white" stop-opacity=".85"/><stop offset=".4" stop-color="#ffbdac" stop-opacity=".45"/><stop offset="1" stop-color="#efb6af" stop-opacity=".15"/></linearGradient>
  <filter id="shadow" x="-.8" y="-.8" width="2.6" height="3"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="blur" x="-.6" y="-.6" width="2.2" height="2.2"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="shine" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
