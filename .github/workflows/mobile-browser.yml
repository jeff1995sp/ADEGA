name: Conferir navegação mobile
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tests/mobile-browser.cjs'
      - '.github/workflows/mobile-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    name: Chromium e WebKit em telas de celular
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/mobile-browser.cjs
